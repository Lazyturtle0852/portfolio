name: Preview on GitHub Pages

# 本番（main → VPS）とは別に、作業ブランチをプレビューとして GitHub Pages に出す
on:
  push:
    branches:
      - feature/astro
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      # https://lazyturtle0852.github.io/portfolio/ に置くため、サブパスでビルドする
      - name: Build
        run: npm run build
        env:
          SITE: https://lazyturtle0852.github.io
          BASE_PATH: /portfolio
          PUBLIC_PREVIEW: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
